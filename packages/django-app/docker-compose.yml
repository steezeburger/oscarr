volumes:
  oscarr_postgres:
    external: true

services:
  db:
    image: postgres:15.4
    env_file:
      - ./.env
    ports:
      - "5432:5432"
    volumes:
      - oscarr_postgres:/var/lib/postgresql/data/
  web:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ./.env
    environment:
      - POSTGRES_HOST=db
      - STATIC_ROOT=/code/app/static/
      - MEDIA_ROOT=/code/app/media/
      - LOGS_DIR=/logs
    command:
      - '/code/bin/wait-for-it.sh'
      - 'db:5432'
      - '--'
      - 'python'
      - '/code/app/manage.py'
      - 'runserver'
      - '0.0.0.0:8000'
    volumes:
      - .:/code
      - ./logs:/logs
      - ./backups:/backups
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - db
  bot:
    profiles: ["bot"]
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ./.env
    environment:
      - POSTGRES_HOST=db
      - LOGS_DIR=/logs
    working_dir: /code/app
    command:
      - '/code/bin/wait-for-it.sh'
      - 'db:5432'
      - '--'
      - 'python'
      - '/code/app/manage.py'
      - 'start_discord_bot'
    volumes:
      - .:/code
      - ./logs:/logs
    depends_on:
      - db
    restart: unless-stopped
