name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-checks:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    defaults:
      run:
        working-directory: packages/django-app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --no-install-project

      - name: Check formatting with ruff
        run: uv run ruff format --check app

      - name: Lint with ruff
        run: uv run ruff check app

      - name: Type check with pyright
        run: uv run pyright app

      - name: Run tests
        run: uv run pytest app -m "not integration" --cov=app --verbose --cov-report=term --cov-report=xml
        env:
          DJANGO_SECRET_KEY: "test-secret-key-for-ci-only-not-production"
          DEBUG: "False"
          POSTGRES_DB: "test_db"
          POSTGRES_USER: "test_user"
          POSTGRES_PASSWORD: "test_password"
          POSTGRES_HOST: "localhost"
          POSTGRES_PORT: "5432"
          DISCORD_TOKEN: "test-discord-token"
          PGCRYPTO_KEY: "test-pgcrypto-key-32-characters"

      - name: Upload coverage reports to Codecov
        if: github.event_name == 'pull_request'
        uses: codecov/codecov-action@v4
        with:
          files: packages/django-app/coverage.xml
          flags: unittests
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
